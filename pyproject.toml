[project]
name = "f1-race-engineer"
version = "0.1.0"
description = "F1 25 AI Race Engineer — Telemetry ingestion, analysis, and setup recommendation (data-layer first)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.60.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
